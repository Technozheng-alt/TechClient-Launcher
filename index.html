<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MyClient Launcher</title>
    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 18px;
            color: #9ca3af;
        }

        button {
            margin-top: 40px;
            padding: 16px 40px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>MyClient Launcher</h1>
    <p>Fabric 1.21.1 Utility Client</p>

    <button onclick="launch()">Open Minecraft Folder</button>

    <script>
        const { shell } = require('electron');
        const os = require('os');

        function launch() {
            let path;

            if (process.platform === 'win32') {
                path = process.env.APPDATA + "\\.minecraft";
            } else if (process.platform === 'darwin') {
                path = os.homedir() + "/Library/Application Support/minecraft";
            }

            shell.openPath(path);
        }
    </script>

</body>
</html>
